# 초안산캠핑장 자동 예약 도우미 설정
# 이 파일을 config.yaml 로 복사한 뒤 수정하세요.

base_url: "https://nowonsc.moonhwain.kr:447/rsvc/rsv_srm.html?b_id=nowonsc"

# 희망 사이트 우선순위 (앞에서부터 가용 여부 확인)
# H1–H19 Healing, P1–P26 Park, T1–T5 Terrace, C1–C3 Cabin
# 우선순위: 캐빈(C) → 테라스(T) → 파크(P)
# 캐빈(C1–C3)은 자격/증빙 조건이 있을 수 있음
preferred_sites:
  - C1
  - C2
  - C3
  - T1
  - T2
  - T3
  - T4
  - T5
  - P1
  - P2
  - P3
  - P4
  - P5
  - P6
  - P7
  - P8
  - P9
  - P10
  - P11
  - P12
  - P13
  - P14
  - P15
  - P16
  - P17
  - P18
  - P19
  - P20
  - P21
  - P22
  - P23
  - P24
  - P25
  - P26

# 숙박 일수 (최대 2박)
nights: 1

# 전기 사용 여부
electricity: true

# 예약 희망 시작일 (YYYY-MM-DD). watch 모드에서는 다음 달 오픈 기준으로 조정할 수 있음.
# 비워 두면 CLI --date 또는 watch 시 다음 오픈 대상일을 사용.
target_date: null

# 브라우저를 화면에 표시 (예약일에는 false 권장 — 사용자가 확인 가능)
headless: false

# 로그인 약 2분 전 워밍 (watch 모드)
warm_login_seconds_before: 120

# 결제 직전까지만 진행 (true 고정 권장 — 결제는 반드시 사람이)
stop_before_payment: true

# 타임존 (변경하지 마세요)
timezone: "Asia/Seoul"

# 스크린샷/로그 저장 경로
artifacts_dir: "artifacts"
